name: Publish shared guide Worker
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request Cloudflare shared build
        env:
          DEPLOY_HOOK_URL: ${{ secrets.SHARED_WORKER_DEPLOY_HOOK }}
        run: |
          test -n "$DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --retry 2 --connect-timeout 10 --max-time 60 --request POST "$DEPLOY_HOOK_URL"
